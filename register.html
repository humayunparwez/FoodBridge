<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - FoodBridge</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            🍱 FoodBridge
        </div>

    </header>


    <main>

        <section class="login-container">

            <h1>
                Create Account
            </h1>

            <p>
                Join the FoodBridge community
            </p>


            <form id="registerForm">


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >


                <label>
                    Account Type
                </label>

                <select id="role" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="restaurant">
                        🍽️ Restaurant
                    </option>

                    <option value="shelter">
                        🏠 Shelter / NGO
                    </option>

                    <option value="volunteer">
                        🚴 Volunteer
                    </option>

                </select>


                <button type="submit">
                    Create Account
                </button>


            </form>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </section>

    </main>

</body>

</html>
